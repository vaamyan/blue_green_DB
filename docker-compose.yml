services:
  postgres:
    image: postgres:16-alpine
    container_name: bluegreen-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bluegreen
      POSTGRES_USER: bluegreen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluegreen -d bluegreen"]
      interval: 5s
      timeout: 3s
      retries: 10
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bluegreen-dev-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Define PGADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: bluegreen-dev-jenkins
    restart: unless-stopped
    environment:
      BLUEGREEN_DB_HOST: postgres
      BLUEGREEN_DB_PORT: 5432
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - jenkins_data:/var/jenkins_home
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgadmin_data:
  postgres_dev_data:
  jenkins_data:

